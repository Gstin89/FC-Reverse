<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FC리버스 | 팀 현황</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{--navy:#0D1B2A;--blue:#1B4F8A;--sky:#00A8E8;--green:#00C46A;--red:#E84545;--gold:#F5A623;--white:#FFFFFF;--gray0:#F4F6F9;--gray1:#E2E8F0;--gray2:#94A3B8;--gray3:#475569;--card:#FFFFFF;--bg:#F0F4F8;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;font-size:14px;}
.header{background:var(--navy);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--white);display:flex;align-items:center;gap:6px;}
.logo span{color:var(--sky);}
.badge-view{background:rgba(0,168,232,.2);color:var(--sky);font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:1px;}
.tab-bar{background:var(--white);display:flex;border-bottom:1px solid var(--gray1);position:sticky;top:56px;z-index:99;}
.tab{flex:1;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;font-size:10px;font-weight:500;color:var(--gray2);border-bottom:2px solid transparent;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.tab.active{color:var(--blue);border-bottom-color:var(--sky);}
.tab-icon{font-size:18px;}
.page{display:none;padding:16px;}
.page.active{display:block;}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.card-title{font-size:12px;font-weight:700;color:var(--gray2);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.card-title::before{content:'';width:3px;height:14px;background:var(--sky);border-radius:2px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-box{background:var(--white);border-radius:14px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.stat-val{font-size:30px;font-weight:900;font-family:'Bebas Neue',sans-serif;line-height:1;margin-bottom:4px;}
.stat-label{font-size:11px;color:var(--gray2);font-weight:500;}
.wdl{display:flex;gap:8px;margin-bottom:12px;}
.wdl-item{flex:1;border-radius:12px;padding:12px;text-align:center;}
.wdl-item.w{background:#E8FDF2;}.wdl-item.d{background:#FEF9EC;}.wdl-item.l{background:#FEF2F2;}
.wdl-val{font-size:32px;font-weight:900;font-family:'Bebas Neue',sans-serif;line-height:1;}
.wdl-item.w .wdl-val{color:var(--green);}.wdl-item.d .wdl-val{color:var(--gold);}.wdl-item.l .wdl-val{color:var(--red);}
.wdl-label{font-size:11px;font-weight:700;margin-top:4px;}
.ranking-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray0);}
.ranking-row:last-child{border-bottom:none;}
.rank-no{font-size:13px;font-weight:900;color:var(--gray2);width:24px;text-align:center;font-family:'Bebas Neue',sans-serif;}
.rank-name{flex:1;font-size:14px;font-weight:700;}
.rank-val{font-size:15px;font-weight:900;color:var(--blue);font-family:'Bebas Neue',sans-serif;}
.rank-sub{font-size:11px;color:var(--gray2);min-width:40px;text-align:right;}
.game-card{background:var(--white);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;}
.game-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.game-date{font-size:12px;color:var(--gray2);font-weight:500;}
.game-result-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.badge-win{background:#E8FDF2;color:var(--green);}.badge-draw{background:#FEF9EC;color:var(--gold);}
.badge-loss{background:#FEF2F2;color:var(--red);}.badge-none{background:var(--gray0);color:var(--gray2);}
.game-vs{font-size:15px;font-weight:700;}
.game-score{font-size:22px;font-weight:900;font-family:'Bebas Neue',sans-serif;color:var(--navy);}
.game-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.game-tag{font-size:11px;color:var(--gray2);background:var(--gray0);padding:2px 8px;border-radius:20px;}
.section-title{font-size:18px;font-weight:900;color:var(--navy);margin-bottom:14px;}
.empty-state{text-align:center;padding:48px 24px;color:var(--gray2);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-text{font-size:14px;font-weight:500;}
</style>
</head>
<body>
<div class="header">
  <div class="logo">FC <span>REVERSE</span></div>
  <span class="badge-view">VIEW</span>
</div>
<div class="tab-bar">
  <button class="tab active" data-tab="dashboard"><span class="tab-icon">📊</span>대시보드</button>
  <button class="tab" data-tab="history"><span class="tab-icon">📋</span>경기기록</button>
  <button class="tab" data-tab="players"><span class="tab-icon">👤</span>개인상세</button>
</div>
<div id="page-dashboard" class="page active">
  <div class="section-title">📊 2026 시즌 현황</div>
  <div class="wdl">
    <div class="wdl-item w"><div class="wdl-val" id="d-win">0</div><div class="wdl-label">승</div></div>
    <div class="wdl-item d"><div class="wdl-val" id="d-draw">0</div><div class="wdl-label">무</div></div>
    <div class="wdl-item l"><div class="wdl-val" id="d-loss">0</div><div class="wdl-label">패</div></div>
  </div>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-val" id="d-total-games" style="color:var(--blue)">0</div><div class="stat-label">총 경기수</div></div>
    <div class="stat-box"><div class="stat-val" id="d-win-rate" style="color:var(--green)">0%</div><div class="stat-label">승률</div></div>
    <div class="stat-box"><div class="stat-val" id="d-total-goals" style="color:var(--sky)">0</div><div class="stat-label">총 득점</div></div>
    <div class="stat-box"><div class="stat-val" id="d-goal-diff" style="color:var(--green)">+0</div><div class="stat-label">득실 차</div></div>
  </div>
  <div class="card"><div class="card-title">⚽ 득점 순위</div><div id="goal-ranking"></div></div>
  <div class="card"><div class="card-title">🎯 어시스트 순위</div><div id="assist-ranking"></div></div>
  <div class="card"><div class="card-title">✅ 출석 순위</div><div id="att-ranking"></div></div>
  <div class="card"><div class="card-title">⭐ MOM 순위</div><div id="mom-ranking"></div></div>
</div>
<div id="page-history" class="page">
  <div class="section-title">📋 경기 기록</div>
  <div id="history-list"></div>
</div>

<div id="page-players" class="page">
  <div class="section-title">👤 선수 개인 스탯</div>
  <div style="display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;">
    <button class="stat-sort-btn active" data-sort="no" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--sky);background:var(--sky);color:white;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;">번호순</button>
    <button class="stat-sort-btn" data-sort="att" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--gray1);background:white;color:var(--gray3);font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;">출석순</button>
    <button class="stat-sort-btn" data-sort="goals" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--gray1);background:white;color:var(--gray3);font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;">득점순</button>
    <button class="stat-sort-btn" data-sort="assists" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--gray1);background:white;color:var(--gray3);font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;">어시순</button>
    <button class="stat-sort-btn" data-sort="rp" style="padding:7px 14px;border-radius:20px;border:1.5px solid var(--gray1);background:white;color:var(--gray3);font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;">RP순</button>
  </div>
  <div id="players-list"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = { databaseURL: "https://fc-reverse-default-rtdb.firebaseio.com" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const PLAYERS=[{no:1,name:"이동욱"},{no:2,name:"홍동의"},{no:3,name:"김동훈"},{no:4,name:"전영욱"},{no:5,name:"정지훈"},{no:6,name:"최원일"},{no:7,name:"이성준"},{no:8,name:"정겨운"},{no:9,name:"박은길"},{no:10,name:"최준원"},{no:11,name:"송주엽"},{no:12,name:"정성국"},{no:14,name:"장현성"},{no:16,name:"임상일"},{no:17,name:"이충용"},{no:18,name:"김동희"},{no:20,name:"서영훈"},{no:21,name:"유정두"},{no:24,name:"이종훈"},{no:25,name:"윤상현"},{no:27,name:"강석준"},{no:29,name:"김성진"},{no:30,name:"박준현"},{no:31,name:"최재오"},{no:33,name:"김준모"},{no:34,name:"송규태"},{no:67,name:"구민수"},{no:77,name:"이상문"},{no:87,name:"류성민"},{no:92,name:"김동균"},{no:99,name:"박상준"}];

let state={games:[],rpLog:{}};

onValue(ref(db,'fcreverse'),(snapshot)=>{
  const data=snapshot.val();
  if(data){state=data;if(!state.games)state.games=[];}
  const activeTab=document.querySelector('.tab.active');
  if(activeTab?.textContent.includes('대시보드'))renderDashboard();
  else if(activeTab?.textContent.includes('경기기록'))renderHistory();
  else if(activeTab?.textContent.includes('선수'))renderPlayers();
});

function switchTab(name,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');el.classList.add('active');
  if(name==='dashboard')renderDashboard();
  if(name==='history')renderHistory();
  if(name==='players')renderPlayers();
}
window.switchTab=switchTab;

function renderDashboard(){
  const games=state.games||[];
  const nonF=games.filter(g=>g.result&&g.result!=='none'&&!g.friendly);
  const wins=nonF.filter(g=>g.result==='win').length;
  const draws=nonF.filter(g=>g.result==='draw').length;
  const losses=nonF.filter(g=>g.result==='loss').length;
  const wr=nonF.length?Math.round(wins/nonF.length*1000)/10:0;
  const tg=games.reduce((s,g)=>s+(g.scoreUs||0),0);
  const tc=games.reduce((s,g)=>s+(g.scoreThem||0),0);
  document.getElementById('d-win').textContent=wins;document.getElementById('d-draw').textContent=draws;document.getElementById('d-loss').textContent=losses;
  document.getElementById('d-total-games').textContent=games.length;document.getElementById('d-win-rate').textContent=wr+'%';document.getElementById('d-total-goals').textContent=tg;
  const diff=tg-tc;const dEl=document.getElementById('d-goal-diff');dEl.textContent=(diff>=0?'+':'')+diff;dEl.style.color=diff>=0?'var(--green)':'var(--red)';
  const stats={};PLAYERS.forEach(p=>{stats[p.no]={name:p.name,att:0,goals:0,assists:0,mom:0};});
  games.forEach(g=>{PLAYERS.forEach(p=>{const d=g.players?.[p.no];if(!d)return;if(d.att)stats[p.no].att++;stats[p.no].goals+=d.goals||0;stats[p.no].assists+=d.assists||0;if(d.mom)stats[p.no].mom++;});});
  renderRanking('goal-ranking',Object.values(stats).filter(s=>s.goals>0).sort((a,b)=>b.goals-a.goals),'goals','골','var(--green)');
  renderRanking('assist-ranking',Object.values(stats).filter(s=>s.assists>0).sort((a,b)=>b.assists-a.assists),'assists','어시','var(--blue)');
  const totalG=games.length;
  document.getElementById('att-ranking').innerHTML=Object.values(stats).sort((a,b)=>b.att-a.att).slice(0,10).map((s,i)=>`<div class="ranking-row"><div class="rank-no">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div><div class="rank-name">${s.name}</div><div class="rank-val" style="color:var(--sky)">${s.att}</div><div class="rank-sub">(${totalG?Math.round(s.att/totalG*100):0}%)</div></div>`).join('');
  renderRanking('mom-ranking',Object.values(stats).filter(s=>s.mom>0).sort((a,b)=>b.mom-a.mom),'mom','회','var(--gold)');
}

function renderRanking(id,data,field,unit,color){
  const el=document.getElementById(id);
  if(!data.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">데이터 없음</div></div>';return;}
  el.innerHTML=data.slice(0,10).map((s,i)=>`<div class="ranking-row"><div class="rank-no">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div><div class="rank-name">${s.name}</div><div class="rank-val" style="color:${color}">${s[field]}</div><div class="rank-sub">${unit}</div></div>`).join('');
}

function renderHistory(){
  const el=document.getElementById('history-list');
  if(!state.games||!state.games.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">⚽</div><div class="empty-text">아직 경기 기록이 없어요</div></div>';return;}
  el.innerHTML=[...state.games].reverse().map(g=>{
    const bc=g.friendly?'badge-draw':g.result==='win'?'badge-win':g.result==='draw'?'badge-draw':g.result==='loss'?'badge-loss':'badge-none';
    const rt=g.friendly?'자체전':g.result==='win'?'승':g.result==='draw'?'무':g.result==='loss'?'패':'미진행';
    const scorers=PLAYERS.filter(p=>(g.players?.[p.no]?.goals||0)>0).map(p=>`${p.name}(${g.players[p.no].goals})`).join(' ');
    const mom=PLAYERS.find(p=>g.players?.[p.no]?.mom);
    const attCount=PLAYERS.filter(p=>g.players?.[p.no]?.att).length;
    return`<div class="game-card" onclick="toggleDetail('${g.id}')"><div class="game-card-header"><span class="game-date">${g.date} · ${g.round}회차</span><span class="game-result-badge ${bc}">${rt}</span></div><div style="display:flex;justify-content:space-between;align-items:center;"><div class="game-vs">${g.friendly?'🤝 자체전':`vs ${g.opponent||'상대팀'}`}</div>${g.result==='none'?`<span style="font-size:13px;color:var(--gray2);">${g.noneReason||''}</span>`:`<div class="game-score">${g.scoreUs} : ${g.scoreThem}</div>`}</div><div class="game-meta">${g.venue?`<span class="game-tag">🏟 ${g.venue}</span>`:''}<span class="game-tag">👥 ${attCount}명</span>${mom?`<span class="game-tag">⭐ ${mom.name}</span>`:''}</div><div id="detail-${g.id}" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--gray0);">${scorers?`<div style="font-size:12px;margin-bottom:4px;">⚽ ${scorers}</div>`:''}${g.feedback?`<div style="font-size:12px;color:var(--gray3);line-height:1.5;">📝 ${g.feedback}</div>`:''}</div></div>`;
  }).join('');
}

function toggleDetail(id){const el=document.getElementById('detail-'+id);if(el)el.style.display=el.style.display==='block'?'none':'block';}
window.toggleDetail=toggleDetail;

function renderPlayers(sortKey='no') {
  const games = state.games || [];
  const totalG = games.length;
  const stats = {};
  PLAYERS.forEach(p => {
    stats[p.no] = { no: p.no, name: p.name, att: 0, goals: 0, assists: 0, mom: 0, absent: 0, rp: state.rpLog?.[p.no] || 0 };
  });
  games.forEach(g => {
    PLAYERS.forEach(p => {
      const d = g.players?.[p.no];
      if (!d) return;
      if (d.att) stats[p.no].att++;
      stats[p.no].goals += d.goals || 0;
      stats[p.no].assists += d.assists || 0;
      if (d.mom) stats[p.no].mom++;
      if (d.absent) stats[p.no].absent++;
    });
  });

  let arr = Object.values(stats);
  if (sortKey === 'no')           arr.sort((a,b) => a.no - b.no);
  else if (sortKey === 'att')     arr.sort((a,b) => b.att - a.att);
  else if (sortKey === 'goals')   arr.sort((a,b) => b.goals - a.goals);
  else if (sortKey === 'assists') arr.sort((a,b) => b.assists - a.assists);
  else if (sortKey === 'rp')      arr.sort((a,b) => b.rp - a.rp);

  const el = document.getElementById('players-list');
  el.innerHTML = arr.map(s => {
    const attRate = totalG ? Math.round(s.att / totalG * 100) : 0;
    return `
    <div style="background:white;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <div style="background:var(--navy);color:white;font-family:'Bebas Neue',sans-serif;font-size:15px;font-weight:900;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;">${s.no}</div>
        <div style="font-size:16px;font-weight:900;">${s.name}</div>
        ${s.mom > 0 ? `<div style="font-size:11px;background:#FEF9EC;color:var(--gold);padding:2px 8px;border-radius:20px;font-weight:700;">⭐ MOM ${s.mom}회</div>` : ''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;">
        <div style="background:var(--gray0);border-radius:10px;padding:8px 4px;">
          <div style="font-size:18px;font-weight:900;font-family:'Bebas Neue',sans-serif;color:var(--sky);">${s.att}</div>
          <div style="font-size:10px;color:var(--gray2);font-weight:500;">출석</div>
          <div style="font-size:10px;color:var(--gray2);">${attRate}%</div>
        </div>
        <div style="background:var(--gray0);border-radius:10px;padding:8px 4px;">
          <div style="font-size:18px;font-weight:900;font-family:'Bebas Neue',sans-serif;color:var(--green);">${s.goals}</div>
          <div style="font-size:10px;color:var(--gray2);font-weight:500;">득점</div>
        </div>
        <div style="background:var(--gray0);border-radius:10px;padding:8px 4px;">
          <div style="font-size:18px;font-weight:900;font-family:'Bebas Neue',sans-serif;color:var(--blue);">${s.assists}</div>
          <div style="font-size:10px;color:var(--gray2);font-weight:500;">어시</div>
        </div>
        <div style="background:var(--gray0);border-radius:10px;padding:8px 4px;">
          <div style="font-size:18px;font-weight:900;font-family:'Bebas Neue',sans-serif;color:${s.rp>=0?'var(--gold)':'var(--red)'};">${s.rp>=0?'+':''}${s.rp.toLocaleString()}</div>
          <div style="font-size:10px;color:var(--gray2);font-weight:500;">RP</div>
        </div>
        <div style="background:var(--gray0);border-radius:10px;padding:8px 4px;">
          <div style="font-size:18px;font-weight:900;font-family:'Bebas Neue',sans-serif;color:${s.absent>0?'var(--red)':'var(--gray2)'};">${s.absent}</div>
          <div style="font-size:10px;color:var(--gray2);font-weight:500;">무단</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

document.querySelectorAll('.stat-sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.stat-sort-btn').forEach(b => {
      b.style.background = 'white'; b.style.color = 'var(--gray3)'; b.style.borderColor = 'var(--gray1)';
    });
    btn.style.background = 'var(--sky)'; btn.style.color = 'white'; btn.style.borderColor = 'var(--sky)';
    renderPlayers(btn.dataset.sort);
  });
});



// Tab event listeners
document.querySelectorAll('.tab[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    switchTab(btn.dataset.tab, btn);
  });
});

</script>
</body>
</html>
